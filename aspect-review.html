<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全問題の観点分類｜ITパスポート</title><link rel="stylesheet" href="styles.css"></head><body><main hidden class="admin-shell"><h1>全1,500問の観点分類</h1><p><a href="admin.html">管理画面へ</a></p><p class="notice">これは問題文のOCRと内容判定ルールによる一次分類です。全問の教員目視確認は完了していません。比率調整のために分類を変えていません。正式な評定への利用前に原本と分類理由を確認してください。</p><section class="admin-card"><div class="field-grid"><label>年度<select id="aspect-year"></select></label><label>観点<select id="aspect-filter"><option value="">両方</option><option>知識・技能</option><option>思考・判断・表現</option></select></label><label><input id="aspect-flag" type="checkbox">OCR要確認候補のみ</label></div><p id="aspect-count" role="status"></p><button id="aspect-csv" class="secondary">表示中の分類一覧CSV</button><button id="aspect-json" class="secondary" disabled>全1,500問の分類JSONを保存</button><p id="aspect-export-message" role="status" class="hint"></p><div id="aspect-items"></div></section></main><noscript>教員画面にはJavaScriptと学校サーバでのログインが必要です。</noscript><script type="module" src="teacher-entry.js" data-teacher-module="aspect-review.js"></script></body></html>
