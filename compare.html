<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生徒別比較｜ITパスポート CBT</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="favicon.svg"></head><body><main hidden class="admin-shell"><nav class="page-navigation" aria-label="ページ移動"><a class="secondary" href="admin.html">教員画面に戻る</a><a class="secondary" href="index.html">表紙に戻る</a></nav><p class="eyebrow">TEACHER / STUDENT PROGRESS</p><h1>生徒別の成績・伸び</h1><p><a href="admin.html">提出管理・成績集計へ</a></p><p class="notice">教員のこのブラウザに取り込んだ提出データを比較します。生徒端末内の未送信記録は表示されません。練習・中断終了は本チャレンジの平均や伸びから除外します。</p><section class="admin-card"><label>生徒を選ぶ<select id="compare-student"></select></label><label>比較する出題条件<select id="compare-group"></select></label><p id="compare-message" role="status"></p><div id="compare-summary" class="progress-summary"></div><div id="compare-legend" class="progress-legend"></div><div id="compare-chart"></div><p class="hint">グラフ・伸びは同じ出題条件だけで比較します。難易度差があるため、正答率の変化は学習の目安です。各問同じ配点で、本試験のIRT評価点とは異なります。</p><h2>分野別の伸び</h2><div id="compare-domains" class="table-wrap"></div><h2>本チャレンジ各回</h2><div class="table-wrap"><table><thead><tr><th>実施回</th><th>状態</th><th>総合</th><th>ストラテジ</th><th>マネジメント</th><th>テクノロジ</th><th>終了日時</th></tr></thead><tbody id="compare-records"></tbody></table></div><p id="compare-practice" class="hint"></p></section><nav class="page-navigation" aria-label="ページ移動"><a class="secondary" href="admin.html">教員画面に戻る</a><a class="secondary" href="index.html">表紙に戻る</a></nav></main><noscript>教員画面にはJavaScriptと学校サーバでのログインが必要です。</noscript><script type="module" src="teacher-entry.js" data-teacher-module="compare.js"></script></body></html>
