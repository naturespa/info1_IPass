<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教員用｜ITパスポート CBT</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="favicon.svg"></head><body><main id="app" class="admin-shell"><p class="eyebrow">TEACHER / IT PASSPORT CBT</p><h1>試験設定・成績集計</h1><p><a href="index.html">受験画面へ</a> · <a href="sources.html">出典・収録年度</a></p>
<section class="admin-card"><h2>受験用URLを作成</h2><form id="settings-form"><div class="field-grid"><label>モード<select id="setting-mode"><option value="school">授業用35問・40分</option><option value="year">年度別100問・120分</option><option value="practice">分野別・ランダム練習</option></select></label><label>出題年度<select id="setting-year"><option value="all">全15回</option></select></label><label>分野<select id="setting-domain"><option value="all">全分野</option><option>ストラテジ系</option><option>マネジメント系</option><option>テクノロジ系</option></select></label><label>練習モードの問題数<select id="setting-count"><option>10</option><option>20</option><option>35</option><option>50</option><option>100</option></select></label><label>練習モードの時間（分）<input id="setting-minutes" type="number" min="1" max="180" value="20" required></label></div><button class="primary" type="submit">受験用URLを作成する</button></form><p class="hint">このURLは初期設定を渡すものです。生徒側でも出題設定を変更できます。</p><label>作成したURL<textarea id="exam-link" readonly></textarea></label><p id="settings-error" class="error" role="alert"></p></section>
<section class="admin-card"><h2>提出された結果を集計</h2><p>生徒の単回／履歴JSONをまとめて選択してください。重複した受験は追加しません。公式正解で再採点して集計します。</p><div class="admin-actions"><label class="secondary">結果JSONを読み込む<input id="result-files" type="file" accept=".json,application/json" multiple hidden></label><label class="secondary">名簿CSVを読み込む<input id="roster-file" type="file" accept=".csv" hidden></label><button id="server-load" class="secondary">学校サーバの成績を読み込む</button><button id="export" class="primary">成績CSVをダウンロード</button><button id="clear" class="secondary">表示中の集計をクリア</button></div><p class="hint">名簿はA列：4桁番号、B列：氏名。UTF-8 / Shift_JISに対応。集計はこの画面だけに保持し、閉じると消えます。</p><p id="admin-status" role="status"></p><div id="stats" class="stats"></div><div class="table-wrap"><table><thead><tr><th>受験番号</th><th>氏名</th><th>実施回</th><th>状態</th><th>名簿照合</th><th>試験</th><th>正解数</th><th>得点率</th><th>ストラテジ</th><th>マネジメント</th><th>テクノロジ</th><th>終了日時</th></tr></thead><tbody id="records"></tbody></table></div></section></main><script type="module" src="admin.js"></script></body></html>
