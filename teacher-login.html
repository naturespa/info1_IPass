<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教員ログイン｜ITパスポート</title><link rel="stylesheet" href="styles.css"></head><body><main class="admin-shell"><nav class="page-navigation" aria-label="ページ移動"><a class="secondary" href="index.html">表紙に戻る</a></nav><h1>教員用パスワード</h1><p><a href="index.html">受験画面へ</a></p><p id="login-message" role="status">学校サーバを確認しています。</p><form id="teacher-login" class="admin-card" hidden><h2 id="login-title">ログイン</h2><label id="current-label" hidden>現在のパスワード<input id="current-password" type="password" autocomplete="current-password" maxlength="256"></label><label>パスワード<input id="teacher-password" type="password" autocomplete="current-password" maxlength="256" required></label><label id="confirm-label" hidden>パスワード（確認）<input id="confirm-password" type="password" autocomplete="new-password" maxlength="256"></label><button id="login-submit" class="primary" type="submit">ログイン</button><p class="hint">初回設定・変更は8文字以上。ログインは最大8時間で終了します。</p></form><div id="signed-in" class="admin-card" hidden><p>ログイン済みです。</p><a href="admin.html" class="primary">教員画面へ</a><button id="change-password" class="secondary">パスワードを変更</button><button id="teacher-logout" class="secondary">ログアウト</button></div><nav class="page-navigation" aria-label="ページ移動"><a class="secondary" href="index.html">表紙に戻る</a></nav></main><script type="module" src="teacher-login.js"></script></body></html>
