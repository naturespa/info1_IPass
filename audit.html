<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問題点検｜ITパスポート CBT</title><link rel="stylesheet" href="styles.css"></head><body><main hidden class="admin-shell"><nav class="page-navigation" aria-label="ページ移動"><a class="secondary" href="admin.html">教員画面に戻る</a><a class="secondary" href="index.html">表紙に戻る</a></nav><p class="eyebrow">QUESTION QUALITY / REVIEW</p><h1>問題・図表の点検と復習分類</h1><p><a href="admin.html">管理画面へ</a></p><section class="admin-card"><div id="audit-summary" class="stats"></div><p class="notice">原本のハッシュ・公式正解・切り出し画像を自動照合しています。文字抽出／OCRで確認できなかった項目は目視候補であり、欠落を断定するものではありません。全1,500問の意味内容を人が確認済みという表示ではありません。</p><p id="audit-scope"></p><label>問題ID・年度・参考単元で検索<input id="audit-search" placeholder="例：2026r08、セキュリティ"></label><label>問題を選ぶ<select id="audit-question"></select></label><p id="audit-label"></p><p id="audit-hint"></p><div id="audit-image" class="cbt-body"></div><p id="audit-links"></p><button id="audit-mark" class="secondary">この端末で目視確認済みにする</button><p id="audit-message" role="status"></p><p class="hint">制度や規格の現行性は別途確認が必要です。原本の出題・公式正解を無断で書き換えず、出題年度と最新の一次資料を区別して扱います。</p></section><nav class="page-navigation" aria-label="ページ移動"><a class="secondary" href="admin.html">教員画面に戻る</a><a class="secondary" href="index.html">表紙に戻る</a></nav></main><noscript>教員画面にはJavaScriptと学校サーバでのログインが必要です。</noscript><script type="module" src="teacher-entry.js" data-teacher-module="audit.js"></script></body></html>
