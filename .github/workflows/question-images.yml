name: Build and verify question PNGs
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_question_images.py'
      - 'assets/*.svg'
      - 'data/*.json'
      - '.github/workflows/question-images.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: question-images
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python scripts/build_question_images.py
      - run: python scripts/build_question_images.py --check
      - name: Save generated question PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/questions/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate verified per-question PNG images'
            git push origin HEAD:main
          fi
      - name: Request a Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
